name: Build and Release Windows Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            make
            libtool
            autoconf
            automake-wrapper
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-curl

      - name: Build libimobiledevice from Upstream Source (MSYS2 MINGW64)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/mingw64/bin:/usr/bin:$PATH"
          export PKG_CONFIG="/mingw64/bin/pkg-config"
          export PKG_CONFIG_PATH="/mingw64/lib/pkgconfig:/mingw64/share/pkgconfig"
          export ACLOCAL_PATH="/mingw64/share/aclocal:/usr/share/aclocal"

          echo "Verifying libcurl and openssl via pkg-config..."
          $PKG_CONFIG --modversion libcurl
          $PKG_CONFIG --modversion openssl

          WORK_ROOT="$(pwd)"
          DEST_BIN="$WORK_ROOT/bin"
          SRC_DIR="$WORK_ROOT/build/libimobiledevice-src"
          mkdir -p "$DEST_BIN" "$SRC_DIR"
          cd "$SRC_DIR"

          repos=(
            "libplist"
            "libimobiledevice-glue"
            "libusbmuxd"
            "libtatsu"
            "libimobiledevice"
          )

          for repo in "${repos[@]}"; do
            echo "=========================================="
            echo "Cloning & Building $repo..."
            echo "=========================================="
            rm -rf "$repo"
            git clone "https://github.com/libimobiledevice/$repo.git" "$repo"
            pushd "$repo"
            extra_flags="--without-cython"
            if [ "$repo" = "libimobiledevice" ]; then
              extra_flags="--without-cython --without-readline"
            fi
            ./autogen.sh --prefix=/mingw64 CC=gcc CXX=g++ PKG_CONFIG="$PKG_CONFIG" $extra_flags
            make -j"$(nproc)"
            make install
            popd
          done

          exes=(
            "afcclient.exe"
            "idevice_id.exe"
            "idevicename.exe"
            "ideviceinfo.exe"
            "idevicepair.exe"
          )

          for exe in "${exes[@]}"; do
            cp -f "/mingw64/bin/$exe" "$DEST_BIN/"
            ldd "/mingw64/bin/$exe" | awk '/=> \/mingw64\/bin\// { print $3 }' | while read -r dll; do
              if [ -n "$dll" ] && [ -f "$dll" ]; then
                cp -f "$dll" "$DEST_BIN/"
              fi
            done
          done

          ls -lh "$DEST_BIN"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Package Windows Release Archive
        shell: pwsh
        run: |
          ./scripts/build_release.ps1

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSMediaMover-Windows-x64
          path: dist/iOSMediaMover-Windows-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/iOSMediaMover-Windows-x64.zip
          generate_release_notes: true
