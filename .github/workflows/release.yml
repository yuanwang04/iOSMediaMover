name: Build and Release Windows Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          location: C:\msys64
          install: >-
            base-devel
            git
            make
            libtool
            autoconf
            automake-wrapper
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-curl

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Pull & Build libimobiledevice and Package Release
        shell: pwsh
        run: |
          ./scripts/build_release.ps1 -BuildLibimobiledeviceFromSource -Msys2Root "C:\msys64"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSMediaMover-Windows-x64
          path: dist/iOSMediaMover-Windows-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/iOSMediaMover-Windows-x64.zip
          generate_release_notes: true
